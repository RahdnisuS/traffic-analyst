# Traffic Analyst: single source of truth for all tunable parameters.
# Units: metres, seconds, m/s, m/s^2, vehicles/hour (vph).
# Every section is validated by sim/config.py (Pydantic). Unknown keys are errors.

sim:
  dt: 0.1                 # integration step (s). 0.1 s is the usual choice for IDM: stable and cheap.
  seed: 42                # master RNG seed; same seed + same config gives an identical run
  duration_s: 600         # default run length for the headless CLI
  junction: junctions/four_way_2x2.json

# Car-following (IDM) parameters per vehicle type. Values are typical of Indian urban traffic:
# bikes (motorcycles/scooters) are quick and keep short gaps, autos (auto-rickshaws) are light
# but low-powered, buses are long, heavy and slow to start. Bikes also filter between lanes.
vehicle_types:
  car:
    length: 4.5           # m
    width: 1.8            # m
    max_accel: 1.5        # IDM "a": comfortable max acceleration
    comfort_decel: 2.0    # IDM "b": comfortable braking
    max_decel: 8.0        # physical braking limit (clamps IDM in emergencies)
    desired_speed: 13.9   # IDM "v0": 50 km/h urban
    time_headway: 1.5     # IDM "T": desired time gap to the leader
    min_gap: 2.0          # IDM "s0": bumper-to-bumper gap when stopped
    accel_exponent: 4.0   # IDM "delta": how sharply acceleration drops near v0
  bike:
    length: 2.0
    width: 0.8
    max_accel: 2.5        # light and powerful for its weight: first away from the line
    comfort_decel: 2.5
    max_decel: 7.0
    desired_speed: 13.9
    time_headway: 1.0     # riders follow closely
    min_gap: 1.0
    accel_exponent: 4.0
    filters: true         # rides the gap between queued vehicles to the front
  auto:
    length: 2.9
    width: 1.4
    max_accel: 1.0        # small engine: slow off the line
    comfort_decel: 1.8
    max_decel: 6.0
    desired_speed: 11.1   # 40 km/h
    time_headway: 1.3
    min_gap: 1.5
    accel_exponent: 4.0
  bus:
    length: 12.0
    width: 2.6
    max_accel: 0.8        # heavy: the slowest to clear a junction
    comfort_decel: 1.5
    max_decel: 5.0
    desired_speed: 11.1
    time_headway: 1.8     # a long vehicle needs more stopping margin
    min_gap: 3.0
    accel_exponent: 4.0
    kerb_lane: true       # buses keep left, near the kerb (where the bus stops are)

demand:
  per_approach_vph: {N: 450, E: 350, S: 450, W: 350}
  turn_probabilities: {left: 0.25, straight: 0.55, right: 0.20}
  vehicle_mix: {car: 0.35, bike: 0.45, auto: 0.15, bus: 0.05}  # weights, normalised; two-wheelers dominate Indian traffic
  speed_factor_std: 0.08  # driver heterogeneity: v0 is scaled by N(1, std), clipped

driver:
  aggressiveness: 0.5     # 0 timid .. 0.5 baseline .. 1 aggressive (shorter headways, harder accel)

signals:
  controller: fixed
  green_s: 25             # per phase (a single number, or a list with one value per phase)
  amber_s: 3
  all_red_s: 2            # clearance so stragglers leave the box before conflicting traffic starts
  min_green_s: 7          # safety floor; also enforced on the RL agent later

intersection:
  turn_lateral_accel: 2.5 # m/s^2; turn speed = sqrt(a_lat * radius)
  lookahead_m: 150        # how far ahead a driver scans for a leader across edges
  conflict_distance_m: 2.5 # two turning paths closer than this are treated as conflicting
  filter_speed: 5.5       # m/s; bikes squeezing past queued (near-stationary) vehicles ride slowly (~20 km/h)
  filter_conflict_distance_m: 1.5 # bike paths only: a 0.8 m bike fits beside a car 1.75 m away
  filter_trigger_gap: 12  # m; a bike starts filtering once a slow (queued) leader is this close
  lateral_speed: 1.2      # m/s sideways while moving into the filter gap (smooths the drawing)

# Pedestrians: social force model (Helbing & Molnar 1995). Each walker is pulled towards their
# goal and pushed away from other people and from kerbs. Crossings run an exclusive, on-demand
# pedestrian phase: pressing the button adds WALK + flashing DON'T WALK, with all traffic held red.
pedestrians:
  rate_ph: 300            # arrivals per hour across all four crosswalks
  desired_speed_mean: 1.34 # m/s (typical free walking speed)
  desired_speed_std: 0.26
  radius: 0.25            # m, body radius
  relaxation_time: 0.5    # tau (s): how fast a walker adjusts to their desired velocity
  repulsion_strength: 2.5 # A (m/s^2): push between two people at contact
  repulsion_range: 0.3    # B (m): how quickly that push fades with distance
  anisotropy: 0.35        # lambda: someone behind you matters 35% as much as someone ahead
  anticipation_s: 0.5     # look-ahead of the elliptical spec: react to where people WILL be (0 = circular)
  wall_strength: 5.0      # kerbs and crosswalk edges push walkers back
  wall_range: 0.1
  max_speed_factor: 1.3   # nobody walks faster than 1.3x their own desired speed
  walk_s: 7               # WALK interval (s); 7 s is the MUTCD minimum
  min_greens_between: 4   # vehicle greens between pedestrian phases: 4 = at most once per cycle.
                          # 1 would serve walkers after every phase, but costs vehicles ~1/3 of the clock
  clearance_speed: 1.07   # m/s (3.5 ft/s, MUTCD); flashing DON'T WALK = crossing length / this
  sidewalk_approach_m: 18 # walkers appear (and leave) this far up the sidewalk

metrics:
  queue_speed: 2.0        # m/s; slower than this on an inbound lane = queued (HCM uses ~5 mph)
  window_s: 120           # rolling window for throughput, delay and Level of Service
  queue_spike_on: 12      # vehicles queued on one approach -> a queue_spike episode starts
  queue_spike_off: 8      # ...and ends when it falls back to this (hysteresis: no flicker)
  spillback_on_frac: 0.9  # queue tail reaches 90% of lane length -> spillback episode
  spillback_off_frac: 0.7
  gridlock_window_s: 60   # no vehicle has left the junction for this long...
  gridlock_stopped_frac: 0.9 # ...and >=90% of vehicles in the network are stopped
  gridlock_min_vehicles: 4

logging:
  enabled: true
  runs_dir: data/runs

# Stress test / capacity benchmark (Phase 6). Demand is stepped up until the junction can no
# longer serve it. "Breakdown" = OVERSATURATION, not literal gridlock: the box-junction rule means
# the box itself never locks up; past capacity the extra demand just queues outside the network.
# Vehicles are conserved, so for each approach over a measured window:
#     arrivals - departures = growth of that approach's stock (on the road + waiting to enter)
# A level FAILS if any approach's stock grows by more than max(unserved_frac x its arrivals,
# unserved_min) vehicles, i.e. it serves under ~95% of its demand, or if gridlock is detected.
# Stock growth is measured between cycle-AVERAGED stocks (queues are a sawtooth over each cycle).
# Capacity score = total throughput (veh/h) at the highest level that passed.
benchmark:
  seeds: [1, 2, 3]        # each seed is an independent ramp; the score is reported as mean +/- std
  start_vph: 100          # mean demand per approach at the first level (config ratios are kept)
  step_vph: 50
  max_vph: 1500
  warmup_s: 300           # fill the network before measuring (an empty junction flatters capacity)
  measure_s: 1200         # ~10 cycles. Measured: with 600 s, levels near capacity flipped between
                          # pass and fail by seed; with 1200 s every seed agrees to within one step
  unserved_frac: 0.05     # an approach may fall this far behind its demand and still "pass"...
  unserved_min: 10        # ...or this many vehicles, whichever is larger: residual noise after
                          # cycle-averaging (uneven cycles when a pedestrian phase is inserted)
  fails_to_stop: 2        # stop the ramp after this many consecutive failed levels (noise guard)
  results_dir: experiments/results/benchmark
  # Live dashboard ramp: one continuous run, so queues carry over between steps. A demo and
  # sanity check; the official score comes from `python -m bench`.
  live_start_vph: 100
  live_step_vph: 100
  live_step_s: 360        # simulated seconds per step (~2.5 cycles judged; noisier than the CLI)...
  live_settle_s: 60       # ...of which the first part settles and only the rest is judged
