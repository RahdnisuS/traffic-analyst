# Overrides for the public demo (Google Cloud Run). Loaded on top of config.yaml when the
# environment variable TRAFFIC_OVERLAY=deploy/public.yaml is set (the Dockerfile sets it).
server:
  sessions: per_visitor   # strangers must not move each other's sliders
  max_sessions: 4         # 1 vCPU: each sim (twice that while comparing) costs a share of it
  idle_close_s: 120
  keep_runs: false        # visitors' runs are not kept (the disk is temporary anyway)
  chat_per_hour: 10       # protects the free-tier Groq quota (~200k tokens/day, ~60 questions)
